name: Build PS4 PKG Bridge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  toolchain-smoke:
    name: OpenOrbis Toolchain Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test OpenOrbis Toolchain
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            openorbisofficial/toolchain:latest \
            bash -c '
              set -e
              echo "================================"
              echo " OpenOrbis PS4 Toolchain"
              echo "================================"
              echo
              echo "Repository:"
              ls -la
              echo
              echo "Toolchain test:"
              which clang || true
              which ld.lld || true
              echo
              echo "OpenOrbis toolchain container OK."
              echo "Smoke test passed."
            '
