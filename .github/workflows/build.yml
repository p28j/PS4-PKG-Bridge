name: Build PS4 PKG Bridge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  toolchain-smoke:
    name: OpenOrbis Toolchain Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OpenOrbis Toolchain
        uses: OpenOrbis/toolchain-action@main
        with:
          version: v0.5.1
          command: |
            set -e
            echo "=== OpenOrbis PS4 Toolchain ==="
            echo "Toolchain path: $OO_PS4_TOOLCHAIN"
            test -n "$OO_PS4_TOOLCHAIN"
            test -d "$OO_PS4_TOOLCHAIN"
            echo "Toolchain detected successfully."
            echo "=== Repository files ==="
            ls -la
            echo "=== Smoke test passed ==="
